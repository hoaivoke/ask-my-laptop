<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ask the AI</title>
  <meta name="description" content="Pick a model and ask a question.">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💬</text></svg>">
  <link rel="stylesheet" href="style.css">
  <script src="config.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js"></script>
  <script defer src="app.js"></script>
</head>
<body>
  <div class="app">
    <header>
      <div class="brand">
        <span class="dot" id="status-dot" title="Checking server..."></span>
        <h1>Ask the AI</h1>
      </div>
      <div class="controls">
        <label class="sr-only" for="model">Model</label>
        <select id="model" disabled><option>Loading models…</option></select>
        <button id="new-chat" class="ghost" type="button" title="Start a new chat">New chat</button>
      </div>
    </header>

    <main id="chat" aria-live="polite">
      <div class="empty" id="empty">
        <p class="big">Pick a model, then ask anything.</p>
        <p class="muted" id="status-text">Connecting to the server…</p>
      </div>
    </main>

    <form id="ask-form" autocomplete="off">
      <input id="access-code" type="password" placeholder="Access code" hidden>
      <div class="composer">
        <textarea id="question" rows="1" placeholder="Ask a question…" maxlength="4000" disabled></textarea>
        <button id="send" type="submit" disabled>Send</button>
      </div>
      <p class="fine">Answers come from AI and can be wrong. Questions may be logged by the site owner.</p>
    </form>
  </div>
</body>
</html>
